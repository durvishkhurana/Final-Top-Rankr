[project]
name = "topranker-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
# scipy is only needed by the DE baseline and the reference-run script
dev = ["ruff", "mypy", "pytest", "scipy>=1.14,<2"]

[tool.setuptools.packages.find]
include = ["judge*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# numpy reductions are typed as Any
warn_return_any = false
# baselines are submissions (untyped by contract), not platform code
exclude = ['\.venv', 'judge/baselines/(?!__init__)']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["docker: needs the Docker daemon and the sandbox image"]
